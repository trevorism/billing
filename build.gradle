buildscript {
    ext {
        creds = {
            username = findProperty("github.user") ?: System.getenv("GITHUB_ACTOR")
            password = findProperty("github.token") ?: System.getenv("GITHUB_TOKEN")
        }
    }
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url uri("https://maven.pkg.github.com/trevorism/gradle-acceptance-plugin")
            credentials creds
        }
    }
    dependencies {
        classpath 'com.google.cloud.tools:appengine-gradle-plugin:2.8.7'
        classpath 'com.trevorism:gradle-acceptance-plugin:2.8.2'
    }
}

plugins {
    id("groovy")
    id("com.gradleup.shadow") version "9.4.1"
    id("io.micronaut.application") version "5.0.0"
    id("com.github.node-gradle.node") version "7.1.0"
    id("jacoco")
}

apply plugin: 'com.google.cloud.tools.appengine'
apply plugin: "com.trevorism.gradle.acceptance"

group = "com.trevorism"

repositories {
    mavenCentral()
    maven {
        url uri("https://maven.pkg.github.com/trevorism/secure-http-utils")
        credentials creds
    }
}

dependencies {
    annotationProcessor("io.micronaut.validation:micronaut-validation-processor")

    implementation("io.micronaut.groovy:micronaut-runtime-groovy")
    implementation("io.micronaut:micronaut-jackson-databind")
    implementation("io.micronaut:micronaut-management")
    implementation("io.micronaut.security:micronaut-security")
    runtimeOnly("org.yaml:snakeyaml")

    // Trevorism platform integrations
    implementation 'com.trevorism:datastore-client:4.1.0'         // Repository<T> over the trevorism datastore service
    implementation 'com.trevorism:secure-http-utils:3.2.1'        // SecureHttpClient for calling the stripe service
    implementation 'com.trevorism:micronaut-security-utils:3.0.0' // @Secure -> Trevorism JWT

    // XRP Ledger (crypto provider)
    implementation platform('org.xrpl:xrpl4j-bom:5.0.0')
    implementation 'org.xrpl:xrpl4j-core'
    implementation 'org.xrpl:xrpl4j-client'

    // Cardano (crypto provider)
    implementation 'com.bloxbean.cardano:cardano-client-lib:0.7.1'
    implementation 'com.bloxbean.cardano:cardano-client-backend-blockfrost:0.7.1'
    implementation 'com.bloxbean.cardano:cardano-client-backend-koios:0.7.1' // free, keyless backend (good for testnet)

    implementation("jakarta.annotation:jakarta.annotation-api")
    implementation 'io.projectreactor:reactor-core:3.8.5'

    implementation("io.swagger.core.v3:swagger-annotations")
    compileOnly("io.micronaut.openapi:micronaut-openapi"){
        exclude module:"slf4j-nop"
    }

    runtimeOnly("ch.qos.logback:logback-classic")

    testImplementation 'com.trevorism:test-result-events:0.3.0'
    acceptanceImplementation 'io.cucumber:cucumber-groovy:6.10.4'
}

application {
    mainClass.set("com.trevorism.Application")
}

graalvmNative.toolchainDetection = false
micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("com.trevorism.*")
    }
}

tasks.withType(GroovyCompile) {
    groovyOptions.forkOptions.jvmArgs.add('-Dgroovy.parameters=true')
    groovyOptions.forkOptions.jvmArgs.add('-Dmicronaut.openapi.views.spec=rapidoc.enabled=false,swagger-ui.enabled=true,swagger-ui.theme=flattop')
}

appengine {
    stage.artifact = layout.buildDirectory.file("libs/${project.name}-all.jar")
    deploy {
        projectId = "trevorism-billing"
        stopPreviousVersion = true
        promote = true
        version = "1-0-0"
    }
}

node{
    nodeProjectDir = file("${project.projectDir}/src/app")
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    systemProperty ("trevorism.test.event", findProperty("trevorism.test.event") == "enabled" ? project.name : null)
}

// Real-network provider verification (XRP testnet, Cardano preprod, Stripe test mode).
// Excluded from the normal build; opt in with: gradle integrationTest (requires env vars, see docs/payment-verification.md)
tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs @Tag("integration") provider tests against real testnets/test mode.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    // These depend on env vars + live networks, so never cache/skip them as up-to-date.
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true   // print the txHash line without needing --info
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.4
            }
        }
    }
}

task installNodeDependencies(type: NpmTask) {
    group = "npm"
    args = ['install']
}

task buildApp(type: NpmTask) {
    dependsOn('installNodeDependencies')
    inputs.dir("src/app/src")
    inputs.file("src/app/index.html")
    inputs.file("src/app/package.json")
    inputs.file("src/app/vite.config.js")
    outputs.dir("src/app/dist")
    group = "npm"
    args = ['run', 'build']
}

task testApp(type: NpmTask) {
    group = "npm"
    args = ['run', 'accept']
}

task runApp(type: NpmTask) {
    group = "npm"
    args = ['run','dev']
}

task copyFrontEnd(type: Copy){
    dependsOn("buildApp")
    mustRunAfter(compileGroovy)
    from "src/app/dist"
    into layout.buildDirectory.dir("resources/main/public")
}


jar.dependsOn("copyFrontEnd")
run.dependsOn("copyFrontEnd")
buildLayers.dependsOn("copyFrontEnd")
shadowJar.dependsOn("copyFrontEnd")
compileTestGroovy.mustRunAfter('copyFrontEnd')
compileAcceptanceGroovy.mustRunAfter('copyFrontEnd')
build.dependsOn jacocoTestCoverageVerification